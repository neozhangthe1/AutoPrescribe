[tool.poetry]
name = "splendor-backend"
version = "0.1.0"
description = "Backend for Splendor board game implementation"
authors = ["Devin <devin@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pytest = "^8.3.4"
pytest-asyncio = "^0.25.1"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
